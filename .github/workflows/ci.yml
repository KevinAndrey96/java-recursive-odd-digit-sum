name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ "17", "21", "25" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Compile with -Werror, test and package
        run: mvn -B verify

      - name: Command line smoke test
        run: |
          java -jar target/odd-digit-sum.jar 5 16796 | tee output.txt
          grep -q "Suma            : 17" output.txt
          printf '4\n5674\n' | java -jar target/odd-digit-sum.jar | grep -q "Suma            : 12"
          if java -jar target/odd-digit-sum.jar 3 567; then exit 1; fi
